[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "obi"
version = "0.1.0-alpha"
description = "Ontological Bayesian Intelligence reasoning framework"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Nnamdi Michael Okpala", email = "okpalan@protonmail.com"}]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/obinexusmk2/obi"
Repository = "https://github.com/obinexusmk2/obi"
Issues = "https://github.com/obinexusmk2/obi/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=1.0",
    "twine>=4.0",
    "black>=22.0",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
]

[tool.setuptools.packages.find]
include = ["obi", "obi.*"]

[tool.pytest.ini_options]
testpaths = ["obi/tests", "obi/core/tests"]
python_files = ["test_*.py"]
